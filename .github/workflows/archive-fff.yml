# Constitue l'archive des saisons passees. A lancer a la main, une plage a la fois.
# Ne tourne jamais tout seul : c'est un travail ponctuel, pas un entretien quotidien.
name: Archive des saisons passées

on:
  workflow_dispatch:
    inputs:
      debut:
        description: "Premier identifiant de compétition à sonder (ex. 439150)"
        required: true
        default: "439150"
      fin:
        description: "Dernier identifiant, exclu (ex. 439700). Garde la plage sous 1500."
        required: true
        default: "439700"
      pas:
        description: "Pas du balayage. 1 = complet. Mets 25 pour un simple repérage des blocs de saisons (rapide, ne lit aucun match)."
        required: false
        default: "1"
      cdgs:
        description: "Districts à moissonner (cg_no séparés par des virgules). Côte-d'Or = 28, Saône-et-Loire = 30. Vide = tous."
        required: false
        default: ""
      pause:
        description: "Pause entre deux appels, en secondes. Monte-la si la FFF coupe."
        required: false
        default: "0.40"
      budget:
        description: "Nombre d'appels maximum, garde-fou"
        required: false
        default: "9000"

permissions:
  contents: write

jobs:
  archiver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Moissonner
        env:
          DEBUT:  ${{ inputs.debut }}
          FIN:    ${{ inputs.fin }}
          PAS:    ${{ inputs.pas }}
          CDGS:   ${{ inputs.cdgs }}
          PAUSE:  ${{ inputs.pause }}
          BUDGET: ${{ inputs.budget }}
        run: python3 outils/archive-fff.py

      - name: Déposer l'archive
        if: always()
        run: |
          git config user.name  "Archive FFF"
          git config user.email "actions@github.com"
          git add archives
          git diff --staged --quiet || git commit -m "Archive FFF : plage ${{ inputs.debut }}-${{ inputs.fin }}"
          # le depot a pu bouger pendant les vingt minutes de moisson
          for essai in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "tentative $essai echouee, on recommence"; sleep 5
          done
