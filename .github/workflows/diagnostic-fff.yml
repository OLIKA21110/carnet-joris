# Test jetable, phase 2 : cartographier l'API ouverte api-dofa.fff.fr.
name: Diagnostic FFF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cartographier l'API
        run: |
          set +e
          B="https://api-dofa.fff.fr"
          D=_diagnostic-fff
          rm -rf $D; mkdir -p $D
          R=$D/00-resume.txt; : > $R

          sonde(){  # $1 = nom de fichier, $2 = chemin
            local f="$D/$1.json"
            local code=$(curl -sS -m 30 -H "Accept: application/ld+json" -o "$f" -w "%{http_code}" "$B$2")
            local taille=$(wc -c < "$f")
            printf '%-42s HTTP %s  %8s o\n' "$2" "$code" "$taille" >> $R
            if [ "$code" != "200" ] || [ "$taille" -lt 40 ]; then rm -f "$f"; fi
            # on ne garde pas des fichiers geants dans le depot
            if [ -f "$f" ] && [ "$taille" -gt 300000 ]; then
              head -c 300000 "$f" > "$f.tronque"; mv "$f.tronque" "$f"
              echo "    (tronque a 300 Ko)" >> $R
            fi
          }

          echo "===== Cartographie api-dofa.fff.fr du $(date -u '+%Y-%m-%d %H:%M UTC') =====" >> $R
          echo "" >> $R

          # 1. le point d'entree : il liste toutes les collections disponibles
          sonde "01-entrypoint"      "/api"
          sonde "02-docs"            "/api/docs.jsonld"

          # 2. l'arborescence d'une competition connue (U15 D1 district 21, saison 2025/2026)
          sonde "10-compet"          "/api/compets/439339"
          sonde "11-phases"          "/api/compets/439339/phases"
          sonde "12-poules"          "/api/compets/439339/phases/1/poules"
          sonde "13-classement"      "/api/compets/439339/phases/1/poules/1/classement_journees"
          sonde "14-matchs"          "/api/compets/439339/phases/1/poules/1/matchs"
          sonde "15-rencontres"      "/api/compets/439339/phases/1/poules/1/rencontres"
          sonde "16-equipes"         "/api/compets/439339/phases/1/poules/1/equipes"
          sonde "17-calendrier"      "/api/compets/439339/calendrier"

          # 3. peut-on LISTER les competitions ? c'est la question a 1000 euros :
          #    si oui, la table des cpNo se construit toute seule.
          sonde "20-compets"              "/api/compets"
          sonde "21-compets-cdg28"        "/api/compets?cdg.cg_no=28"
          sonde "22-compets-cdg28-saison" "/api/compets?cdg.cg_no=28&season=2025"
          sonde "23-compets-saison"       "/api/compets?season=2024"
          sonde "24-cdgs"                 "/api/cdgs"
          sonde "25-cdg28"                "/api/cdgs/28"
          sonde "26-cdg28-compets"        "/api/cdgs/28/compets"

          echo "" >> $R
          echo "===== fichiers conserves =====" >> $R
          ls -la $D >> $R
          cat $R

      - name: Déposer les résultats
        run: |
          git config user.name  "Diagnostic"
          git config user.email "actions@github.com"
          rm -f _diagnostic-fff.txt
          git add -A _diagnostic-fff _diagnostic-fff.txt
          git diff --staged --quiet || git commit -m "Cartographie de l'API FFF"
          git push
