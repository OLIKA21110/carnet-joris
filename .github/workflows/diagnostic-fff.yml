# Test jetable, phase 3 : remonter des clubs vers leurs compétitions.
name: Diagnostic FFF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sonder l'API
        run: |
          set +e
          B="https://api-dofa.fff.fr"
          D=_diagnostic-fff
          mkdir -p $D
          R=$D/00-resume.txt; : > $R
          echo "===== Phase 3 du $(date -u '+%Y-%m-%d %H:%M UTC') =====" >> $R
          echo "" >> $R

          sonde(){
            local f="$D/$1.json"
            local code=$(curl -sS -m 30 -H "Accept: application/ld+json" -o "$f" -w "%{http_code}" "$B$2")
            local taille=$(wc -c < "$f")
            printf '%-46s HTTP %s  %8s o\n' "$2" "$code" "$taille" >> $R
            if [ "$code" != "200" ] || [ "$taille" -lt 40 ]; then rm -f "$f"; fi
            if [ -f "$f" ] && [ "$taille" -gt 300000 ]; then
              head -c 300000 "$f" > "$f.t"; mv "$f.t" "$f"
            fi
          }

          sonde "30-club" "/api/clubs/10955"
          sonde "31-club-equipes" "/api/clubs/10955/equipes"
          sonde "32-club-engagements" "/api/clubs/10955/engagements"
          sonde "33-club-competitions" "/api/clubs/10955/competitions"
          sonde "34-club-matchs" "/api/clubs/10955/matchs"
          sonde "35-equipes-filtre" "/api/equipes?club.cl_no=10955"
          sonde "36-engagements-filtre" "/api/engagements?club.cl_no=10955"
          sonde "40-compets-cdg" "/api/compets?cdg=28"
          sonde "41-compets-cdg-iri" "/api/compets?cdg=%2Fapi%2Fcdgs%2F28"
          sonde "42-compets-cpcod" "/api/compets?cp_cod=021"
          sonde "43-compets-saison" "/api/compets?season=2025&cdg=28"
          sonde "44-compets-page" "/api/compets?page=1"
          sonde "50-coupe" "/api/compets/443467"
          sonde "51-coupe-phases" "/api/compets/443467/phases"
          sonde "60-printemps-matchs" "/api/compets/439339/phases/2/poules/1/matchs"

          echo "" >> $R
          ls -la $D >> $R
          cat $R

      - name: Déposer les résultats
        run: |
          git config user.name  "Diagnostic"
          git config user.email "actions@github.com"
          git add -A _diagnostic-fff
          git diff --staged --quiet || git commit -m "Diagnostic FFF phase 3"
          git push
