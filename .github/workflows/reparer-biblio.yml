# Réparation ponctuelle de la bibliothèque des clubs (octobre 2026) : voir outils/reparer-biblio.py.
# À lancer à la main, d'abord en essai à blanc. À supprimer une fois la réparation faite.
name: Réparer la bibliothèque des clubs

on:
  workflow_dispatch:
    inputs:
      appliquer:
        description: "1 pour écrire dans le nuage, 0 pour un essai à blanc"
        default: "0"

jobs:
  reparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Réparer
        env:
          SUPABASE_URL: https://hoyxgmmbngrjigjqptnr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_y9KhYDWM2zyYFC_wtbBhlQ_BcqV9CR9' }}
          APPLIQUER: ${{ inputs.appliquer }}
        run: python3 outils/reparer-biblio.py
